[package]
name = "game-maps-overlay"
description = "Game Maps overlay app"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "game_maps_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
game-maps-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
log = "0.4"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "macros", "time"] }
webview2-com = "0.39"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-opener = "2.7.2"
sha2 = "0.11.1"
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }
sys-locale = "0.3"
