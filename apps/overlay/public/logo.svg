  <path d="M400 368V736M624 448V800" fill="none" stroke="#ab9365" stroke-width="24" stroke-linecap="round"/>
  <!-- A simple broken trail leads across the map to the pin. -->
  <path d="M248 680 300 602Q312 584 332 596L456 670Q472 680 488 666L560 606Q568 600 580 600H640V552" fill="none" stroke="#26352d" stroke-width="36" stroke-dasharray="44 64" stroke-linecap="round" stroke-linejoin="round"/>
