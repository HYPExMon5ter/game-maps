<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Dark tile and rim remain legible on light and dark taskbars. -->
  <rect x="16" y="16" width="992" height="992" rx="208" fill="#0e1216" stroke="#64717d" stroke-width="24"/>
  <!-- Warm paper with alternating edges and tones to describe three folds. -->
  <path d="M176 432 400 352 624 432 848 352V736L624 816 400 736 176 816Z" fill="#f2dfad" stroke="#f2dfad" stroke-width="32" stroke-linejoin="round"/>
  <path d="m400 352 224 80v384l-224-80Z" fill="#d8c28e"/>
  <path d="m624 432 224-80v384l-224 80Z" fill="#f7e8bf"/>
  <!-- Broad land shapes and a winding river read as geography at icon sizes. -->
  <path d="m208 452 160-56 16 64-40 48-68-8-48 28-20-24Z" fill="#729c64"/>
  <path d="m702 608 114-32v136l-128 46-40-32 20-64Z" fill="#729c64"/>
  <path d="M176 544C248 504 294 514 344 546L400 574 474 626Q508 648 544 638L624 612 690 590Q722 578 752 554L848 492V562L788 602Q750 634 710 646L624 674 560 696Q506 716 462 686L400 642 314 604Q252 564 176 610Z" fill="#63afd0"/>
