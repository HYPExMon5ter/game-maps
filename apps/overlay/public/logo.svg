  <path d="M592 184H688L792 288V376L640 552 488 376V288Z" fill="#a855f7" stroke="#0e1216" stroke-width="56" stroke-linejoin="round"/>
  <circle cx="640" cy="320" r="56" fill="#0e1216"/>
</svg>
