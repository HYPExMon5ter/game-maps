[package]
name = "game-maps-agent"
description = "Agent injected into a game process: frame hook, game providers, pipe server"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.23"
game-maps-protocol.workspace = true
il2cpp.workspace = true
minhook = "0.9"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "macros", "time"] }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
