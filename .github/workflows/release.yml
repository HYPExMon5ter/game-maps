# Publishes a new app version. Start it with `python -I tools/release.py`, or from the
# Actions tab: Release -> Run workflow.
#
# It bumps the version, runs the tests, commits and tags the bump on master, then
# builds the signed installer and publishes it as the latest GitHub release. Installed
# apps find it within 30 minutes and update (or ask, if automatic updates are off).
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version (patch, minor, major, or exact like 1.0.0)
        type: string
        default: patch
      notes:
        description: What changed (shown to users in the update prompt)
        type: string
        default: Bug fixes and improvements.

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    steps:
      - name: Check signing secrets
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secrets (see README, Publishing)."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: apps/overlay
        run: bun install --frozen-lockfile

      - name: Test
        shell: bash
        run: |
          # The app bundles the agent DLL, and its build checks that the file exists.
          cargo build --release -p game-maps-agent
          cargo test --workspace
          python -I -m unittest discover -s tools/pins
          python -I -m unittest discover -s tools/mappack
          (cd apps/overlay && bun run test)

      - name: Bump version
        id: version
        shell: bash
        run: |
          version=$(python -I tools/version.py "${{ inputs.bump }}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Nothing to commit when releasing the version already in the files.
          git diff --quiet || git commit -am "Release $version"
          git tag -a "v$version" -m "Game Maps $version"
          git push origin HEAD:master "v$version"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/overlay
          tauriScript: bun run tauri
          tagName: v${{ steps.version.outputs.version }}
          releaseName: Game Maps v${{ steps.version.outputs.version }}
          releaseBody: ${{ inputs.notes }}
          releaseCommitish: master
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
